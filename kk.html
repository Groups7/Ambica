    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
        }

        .hero {
            position: relative;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
        }

        .hero-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .hero-content {
            text-align: center;
            color: white;
            z-index: 3;
            max-width: 800px;
            padding: 0 20px;
        }

        .hero-title {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-hero-primary {
            padding: 12px 24px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
            font-weight: 600;
        }

        .btn-hero-primary:hover {
            background-color: #b2060f;
        }

        .btn-hero-secondary {
            padding: 12px 24px;
            background-color: transparent;
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            text-decoration: none;
            transition: background-color 0.3s, color 0.3s;
            font-weight: 600;
        }

        .btn-hero-secondary:hover {
            background-color: white;
            color: #000;
        }

        .hero-sliders {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .vertical-slider {
            position: absolute;
            width: 250px;
            height: 100%;
            overflow: hidden;
        }

        .slider-1 {
            left: 5%;
        }

        .slider-2 {
            right: 5%;
        }

        .vertical-slider-track {
            display: flex;
            flex-direction: column;
            animation: slideUp linear infinite;
        }

        .vertical-slider-item {
            height: 200px;
            width: 100%;
            margin-bottom: 10px;
        }

        .vertical-slider-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes slideUp {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-50%);
            }
        }

        .hero-mobile-slider {
            display: none;
        }

        @media (max-width: 768px) {
            .hero-sliders {
                display: none;
            }

            .hero-mobile-slider {
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            .mobile-slider {
                height: 100%;
                overflow: hidden;
            }

            .mobile-slider-track {
                display: flex;
                flex-direction: row;
                animation: slideLeft linear infinite;
            }

            .mobile-slider-item {
                min-width: 300px;
                height: 100%;
                flex-shrink: 0;
                margin-right: 10px;
            }

            .mobile-slider-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            @keyframes slideLeft {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(-50%);
                }
            }

            .hero-title {
                font-size: 2rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .hero-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
